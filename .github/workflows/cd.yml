# ⚡ Continuous Deployment — staging on main, production on version tags.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build & push images
        run: |
          echo "Images are built and pushed by docker-build.yml on main pushes."
      - name: Deploy to staging
        run: |
          echo "Deploy to staging cluster for commit ${{ github.sha }}"
          # kubectl/helm apply against the staging context stored as an environment secret.
          # e.g. helm upgrade --install thunders infrastructure/helm/thunders \
          #   --set image.tag=${{ github.sha }} --kube-context staging

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploy tag ${{ github.ref_name }} to production"
          # helm upgrade --install thunders infrastructure/helm/thunders \
          #   --set image.tag=${{ github.ref_name }} --kube-context production
