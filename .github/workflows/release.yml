# ⚡ Release — build artifacts and create a GitHub Release on version tags.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build backend and SDK distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build backend --outdir dist-backend
          python -m build sdk/python --outdir dist-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist-*/

  create-release:
    needs: [build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
