name: 🐛 Bug report
description: Report something broken or unexpected.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill out the details below.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run `...`
        2. Send request `...`
        3. See error
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - backend/api
        - backend/core
        - inference
        - training
        - models/registry
        - data_pipeline
        - apps/web
        - apps/mobile
        - apps/desktop
        - apps/admin
        - sdk
        - infrastructure
        - documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python/Node version, GPU, deployment (local/docker/k8s)…"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
