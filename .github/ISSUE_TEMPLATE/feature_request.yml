name: 💡 Feature request
description: Suggest a new feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to achieve? What limitation did you hit?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketch the API or UX if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - inference
        - training
        - agents
        - rag
        - safety
        - apps/web
        - apps/mobile
        - apps/desktop
        - apps/admin
        - sdk
        - infrastructure
    validations:
      required: true
  - type: checkboxes
    id: willingness
    attributes:
      label: Participation
      options:
        - label: I am willing to submit a PR for this feature.
