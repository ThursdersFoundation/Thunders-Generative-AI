# ⚡ Thunders Generative AI — local development stack
# Infra services + the FastAPI backend. The Next.js web app is run via
# `make web-dev` (add an apps/web Dockerfile to include it here).

name: thunders-generative-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: thunders-postgres
    environment:
      POSTGRES_USER: thunders
      POSTGRES_PASSWORD: thunders
      POSTGRES_DB: thunders_genai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thunders"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thunders-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: thunders-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thunders
      MINIO_ROOT_PASSWORD: thunders123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    container_name: thunders-backend
    env_file:
      - .env
    environment:
      THUNDERS_ENVIRONMENT: development
      THUNDERS_DATABASE_URL: postgresql+asyncpg://thunders:thunders@postgres:5432/thunders_genai
      THUNDERS_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
